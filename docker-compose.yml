# Production stack: PostgreSQL, the FastAPI backend and Caddy serving the React app.
# Settings come from .env.production (copy .env.production.example).
# Start it with: docker compose up -d --build

# Docker keeps container logs forever by default, which eventually fills the disk.
# Each service keeps at most 5 files of 10 MB; rotated files are compressed.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    compress: "true"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *default-logging
    env_file: .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    logging: *default-logging
    env_file: .env.production
    environment:
      CLINIC_DEBUG: "false"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Daily pg_dump to the backups volume and, when BACKUP_S3_BUCKET is set, to Amazon S3.
  backup:
    build: ./deploy/backup
    restart: unless-stopped
    logging: *default-logging
    env_file: .env.production
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Unhealthy when the last successful backup is more than 26 hours old.
      test: ["CMD-SHELL", "test -n \"$$(find /backups/.last-success -mmin -1560 2>/dev/null)\""]
      interval: 1h
      timeout: 10s
      start_period: 10m

  web:
    build:
      context: ./frontend
      args:
        # Must match CLINIC_TIMEZONE in .env.production.
        VITE_CLINIC_TIMEZONE: Asia/Colombo
    restart: unless-stopped
    logging: *default-logging
    env_file: .env.production
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  postgres_data:
  backups:
  caddy_data:
  caddy_config:
